<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fallback tile (chat-alt): after the Big Sur icon style — a large, shaded object on a vivid,
       hue-shifting background. Full-bleed square: the page clips every icon to its squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FC8FF"/><stop offset="1" stop-color="#0A63F0"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="-.1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF5"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#063E9C" flood-opacity=".55"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#063E9C" flood-opacity=".45"/></filter>
    <linearGradient id="bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F2EA"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#light)"/>
  <path d="M58 22C71 22 82 30 82 41C82 47 79 52 74 55L70 47L50 30C52 25 55 22 58 22Z" fill="#fff" opacity=".35"/>
  <g filter="url(#drop)">
    <ellipse cx="46" cy="50" rx="30" ry="24" fill="url(#bub)"/>
    <path d="M24 62C24 70 21 75 15 79C26 79 34 75 38 69Z" fill="url(#bub)"/>
  </g>
  <circle cx="35" cy="50" r="4" fill="#1E86FF"/><circle cx="46" cy="50" r="4" fill="#1E86FF"/><circle cx="57" cy="50" r="4" fill="#1E86FF"/>
</svg>
