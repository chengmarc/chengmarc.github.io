<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fallback tile (video-alt): after the Big Sur icon style — a large, shaded object on a vivid,
       hue-shifting background. Full-bleed square: the page clips every icon to its squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A50"/><stop offset="1" stop-color="#0F0F12"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="-.1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF5"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#000000" flood-opacity=".55"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".45"/></filter>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E9EF"/></linearGradient><linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A50"/><stop offset="1" stop-color="#2C2C30"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#light)"/>
  <g filter="url(#drop)">
    <rect x="17" y="23" width="66" height="45" rx="7" fill="url(#scr)"/>
    <rect x="38" y="70" width="24" height="4.5" rx="2.25" fill="url(#scr)"/>
    <rect x="30" y="74.5" width="40" height="4" rx="2" fill="url(#scr)"/>
  </g>
  <rect x="21" y="27" width="58" height="37" rx="4.5" fill="none" stroke="#000000" stroke-opacity=".12" stroke-width="1"/>
  <path d="M44.5 36.5L60 45.5L44.5 54.5Z" fill="url(#pl)" stroke="url(#pl)" stroke-width="5" stroke-linejoin="round"/>
</svg>
