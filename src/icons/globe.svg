<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fallback tile (globe): after the Big Sur icon style — a large, shaded object on a vivid,
       hue-shifting background. Full-bleed square: the page clips every icon to its squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3CB8FF"/><stop offset="1" stop-color="#0A55DB"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="-.1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF5"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#06338A" flood-opacity=".55"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#06338A" flood-opacity=".45"/></filter>
    <radialGradient id="sph" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#CFE7FF"/><stop offset="1" stop-color="#4FA3F7"/></radialGradient><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BE37A"/><stop offset="1" stop-color="#1FA347"/></linearGradient><clipPath id="c"><circle cx="50" cy="50" r="28"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#light)"/>
  <g filter="url(#drop)"><circle cx="50" cy="50" r="28" fill="url(#sph)"/></g>
  <g clip-path="url(#c)">
    <path d="M30 34C36 28 46 28 49 33C52 38 45 41 46 47C47 53 40 56 36 52C32 48 25 42 30 34Z" fill="url(#land)"/>
    <path d="M57 44C62 40 72 41 76 47C80 53 74 58 70 63C66 69 59 71 57 66C55 60 52 48 57 44Z" fill="url(#land)"/>
    <path d="M53 26C57 24 63 25 64 28C60 30 55 30 53 26Z" fill="url(#land)"/>
    <g fill="none" stroke="#2E77D0" stroke-opacity=".25" stroke-width="1"><ellipse cx="50" cy="50" rx="12" ry="28"/><path d="M22 50H78M25 37H75M25 63H75"/></g>
  </g>
  <ellipse cx="41" cy="35" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-25 41 35)"/>
</svg>
