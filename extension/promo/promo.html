<!doctype html>
<!--
  Source for the store promo tiles. Renders at the size given in the query
  string, built around screenshot-1-desktop.png so the tile shows the product.

    chrome --headless --hide-scrollbars --virtual-time-budget=3000 --window-size=440,280   --screenshot=promo-440x280.png    "file:///.../promo.html?small"
    chrome --headless --hide-scrollbars --virtual-time-budget=3000 --window-size=1400,560  --screenshot=promo-1400x560.png   "file:///.../promo.html?marquee"
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'DM Sans';
    font-weight: 300 700;
    src: url('../../src/fonts/dm-sans-latin.woff2') format('woff2');
}
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    position: relative;
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 8% 10%, rgba(132, 74, 214, .55), transparent 45%),
        radial-gradient(circle at 25% 105%, rgba(214, 110, 60, .38), transparent 45%),
        #0c0b12;
}
.brand { position: absolute; display: flex; flex-direction: column; }
.brand img.logo { filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .45)); }
.brand h1 { font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.brand p  { color: rgba(255, 255, 255, .72); line-height: 1.35; text-wrap: balance; }

/* Browser window holding the screenshot */
.window {
    position: absolute;
    border-radius: var(--r);
    overflow: hidden;
    background: #24232b;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 24px 60px rgba(0, 0, 0, .6);
}
.window .bar {
    height: var(--bar);
    display: flex; align-items: center; gap: calc(var(--bar) * .22);
    padding-left: calc(var(--bar) * .45);
}
.window .bar i { width: calc(var(--bar) * .3); height: calc(var(--bar) * .3); border-radius: 50%; }
.window .bar i:nth-child(1) { background: #ff5f57; }
.window .bar i:nth-child(2) { background: #febc2e; }
.window .bar i:nth-child(3) { background: #28c840; }
.window img { display: block; width: 100%; }

/* 440 × 280 small tile: window runs off the right edge so the icons and
   dock stay big enough to read. */
.small .brand  { left: 22px; top: 0; bottom: 0; width: 170px; justify-content: center; }
.small .logo   { width: 88px; height: 88px; margin: 0 0 10px -5px; }
.small h1      { font-size: 25px; }
.small p       { font-size: 13px; margin-top: 7px; }
.small .window { --r: 9px; --bar: 16px; left: 196px; top: 16px; width: 372px; }

/* 1400 × 560 marquee */
.marquee .brand  { left: 90px; top: 0; bottom: 0; width: 470px; justify-content: center; }
.marquee .logo   { width: 160px; height: 160px; margin: 0 0 24px -10px; }
.marquee h1      { font-size: 64px; }
.marquee p       { font-size: 26px; margin-top: 16px; }
.marquee p.fine  { font-size: 18px; margin-top: 22px; color: rgba(255, 255, 255, .5); }
.marquee .window { --r: 14px; --bar: 28px; left: 590px; top: 35px; width: 740px; }
</style>
</head>
<body>
<div class="brand">
    <img class="logo" src="../../src/app-icon.svg" alt="">
    <h1>Bookmark OS</h1>
    <p>Your bookmarks as a desktop on every new tab.</p>
    <p class="fine">No account · No permissions · Stays in your browser</p>
</div>
<div class="window">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="screenshot-1-desktop.png" alt="">
</div>
<script>
    const size = location.search.slice(1) || 'marquee';
    document.body.className = size;
    if (size === 'small') document.querySelector('.fine').remove();
</script>
</body>
</html>
