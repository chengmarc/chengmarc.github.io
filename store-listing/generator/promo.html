<!doctype html>
<!--
  Layout for the store promo tiles, at the size given in the query string:
  ?small 440x280 (the store's search tile), ?marquee 1400x560. render.py,
  beside this file, renders both, putting a desktop it captured into
  #desktop; opened by hand, the page shows screenshot 1 there instead.

  The message, at first sight: this is a desktop, synced from your
  browser's Bookmarks bar. Both tiles show the whole desktop with
  "Synced from your Bookmarks bar" on it, in a window of the OS itself.
  - small: every pixel is product. The desktop fills the tile, and there
    is no slogan; the store shows the name and icon beside the tile.
  - marquee: room for the pitch on the left, and the same picture on the
    right, as a screen.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'DM Sans';
    font-weight: 300 700;
    src: url('../../src/fonts/dm-sans-latin.woff2') format('woff2');
}
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    position: relative;
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    /* High Sierra's colours, at dusk: its sky above, its autumn gold below,
       on the dark of the mountain. */
    background:
        radial-gradient(circle at 8% 10%, rgba(95, 145, 205, .5), transparent 45%),
        radial-gradient(circle at 25% 105%, rgba(225, 115, 25, .52), transparent 48%),
        #15110e;
}

/* The pitch (marquee only) */
.pitch { position: absolute; display: flex; flex-direction: column; justify-content: center; }
.wordmark { display: flex; align-items: center; font-weight: 600; letter-spacing: -.01em; }
.wordmark img { filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .45)); }
.pitch h1 { font-weight: 700; letter-spacing: -.025em; line-height: 1.04; }
.pitch p  { color: rgba(255, 255, 255, .74); line-height: 1.35; text-wrap: pretty; }
.pitch p.fine { color: rgba(255, 255, 255, .5); }

/* The desktop */
.screen { position: absolute; overflow: hidden; }
.screen img { display: block; width: 100%; }

/* The message, as a window of the OS itself: the window glass, rim, shadow
   and traffic lights from styles/base.css, then the text and an arrow. On
   two lines, so it can be big. Everything in it is sized from the text, so
   each tile sets only its font size. It sits a little above the middle of
   the desktop, where the eye takes the middle to be, between the menu bar
   and the dock. */
.pill {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: .55em;
    padding: 1.36em .86em .73em 1.05em; border-radius: .73em;   /* the top padding is the title bar */
    line-height: 1.12; text-align: center;
    color: #1d1d1f; font-weight: 700; letter-spacing: -.005em;
    white-space: nowrap;
    background: rgba(248, 248, 250, .65);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, .5);
    box-shadow: 0 0 0 .5px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .15),
                0 14px 36px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .82);
}
.lights { position: absolute; top: .5em; left: .55em; display: flex; gap: .35em; }
.lights i { width: .5em; height: .5em; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
/* The arrow: a white arrow on a filled blue circle, in the system blue, as
   macOS draws its filled symbols. */
.arrow { width: 1.95em; height: 1.95em; flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(10, 132, 255, .35)); }

/* 440 × 280 search tile: the desktop, edge to edge */
.small .pitch  { display: none; }
.small .screen { inset: 0; }
.small .pill   { font-size: 22px; }

/* 1400 × 560 marquee: the window is the same share of the desktop as on
   the small tile */
.marquee .pitch    { left: 84px; top: 0; bottom: 0; width: 480px; }
.marquee .wordmark { font-size: 30px; gap: 16px; margin-bottom: 30px; }
.marquee .wordmark img { width: 72px; height: 72px; }
.marquee h1        { font-size: 60px; }
.marquee .pitch p  { font-size: 23px; margin-top: 20px; }
.marquee .pitch p.fine { font-size: 17px; margin-top: 22px; }
.marquee .screen   { left: 596px; top: 50%; transform: translateY(-50%); width: 740px;   /* centred top to bottom */
                     border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 24px 60px rgba(0, 0, 0, .6); }
.marquee .pill     { font-size: 37px; }
</style>
</head>
<body>
<div class="pitch">
    <div class="wordmark"><img src="../../src/app-icon.svg" alt="">Bookmark OS</div>
    <h1>Your bookmarks,<br>as a desktop.</h1>
    <p>Syncs with your browser’s Bookmarks bar: folders become app categories, links become icons. Change a bookmark, and the desktop follows.</p>
    <p class="fine">No account · Nothing leaves your browser</p>
</div>

<div class="screen">
    <img id="desktop" src="../desktop/screenshot-1-desktop.png" alt="">
    <span class="pill"><span class="lights"><i></i><i></i><i></i></span><span>Synced from your<br> Bookmarks bar</span><svg class="arrow" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#0a84ff"/><path d="M10 14.5V5.8M6.2 9.4L10 5.6l3.8 3.8" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</div>

<script>
    document.body.className = location.search.slice(1) || 'marquee';
</script>
</body>
</html>
